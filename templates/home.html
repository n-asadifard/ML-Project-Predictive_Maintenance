<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predictive Maintenance System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .login { max-width: 600px; background: white; padding: 30px; margin: auto; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #333; }
        .mb-3 { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-control { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-primary { background-color: #007bff; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; }
        .btn-primary:hover { background-color: #0056b3; }
        .result { text-align: center; margin-top: 20px; font-weight: bold; color: #d9534f; }
    </style>
</head>
<body>
    <div class="login">
       <h1>Predictive Maintenance Indicator</h1>
       <form action="{{ url_for('predict_datapoint')}}" method="post">
            <legend><h2>Machine Failure Prediction Form</h2></legend>

            <div class="mb-3">
                <label class="form-label">Footfall</label>
                <input class="form-control" type="number" step="any" name="footfall" placeholder="Enter footfall" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Temp Mode</label>
                <input class="form-control" type="number" step="any" name="TempMode" placeholder="Enter TempMode" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Air Quality (AQ)</label>
                <input class="form-control" type="number" step="any" name="AirQuality" placeholder="Enter AirQuality" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Ultrasonic Sensor Data (USS)</label>
                <input class="form-control" type="number" step="any" name="UltrSensData" placeholder="Enter UltrSensData" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Current Sensor Read (CS)</label>
                <input class="form-control" type="number" step="any" name="CurSensRead" placeholder="Enter CurSensRead" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Volatile Organic Compounds (VOC)</label>
                <input class="form-control" type="number" step="any" name="VolatileOrgComp" placeholder="Enter VolatileOrgComp" required />
            </div>
            <div class="mb-3">
                <label class="form-label">RPM</label>
                <input class="form-control" type="number" step="any" name="RPM" placeholder="Enter RPM" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Input Pressure (IP)</label>
                <input class="form-control" type="number" step="any" name="InptPressure" placeholder="Enter InptPressure" required />
            </div>
            <div class="mb-3">
                <label class="form-label">Optimal Temperature</label>
                <input class="form-control" type="number" step="any" name="OptTemp" placeholder="Enter OptTemp" required />
            </div>

            <div class="mb-3">
                <input class="btn-primary" type="submit" value="Predict Machine Status" />
            </div>
        </form>
        {% if results %}
        <h2 class="result">Prediction Result: {{ results }}</h2>
        {% endif %}
    </div>
</body>
</html>
